<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="YatraMap — Find bus routes, stops and fares across Kathmandu Valley."
    />

    <title>
      {% block title %}YatraMap — Kathmandu Valley Bus Routes{% endblock %}
    </title>

    {% block extra_head %}{% endblock %}

    {% load static %}

    <link
      rel="stylesheet"
      href="{% static 'css/yatra-map.css' %}"
    />
  </head>

  <body>
    <div class="app-shell">

      <header class="site-header">
        <div class="container header-inner">

          <a href="{% url 'route_search' %}" class="brand">
            <span class="brand-mark">Y</span>

            <span class="brand-copy">
              <span class="brand-name">YatraMap</span>
              <span class="brand-tagline">
                Kathmandu Valley Transit
              </span>
            </span>
          </a>

          <nav class="main-nav" aria-label="Main navigation">
            <a
              href="{% url 'route_search' %}"
              class="nav-link nav-link-active"
            >
              Routes
            </a>
          </nav>

        </div>
      </header>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <p>
            YatraMap · Kathmandu Valley Bus Route Finder
          </p>
        </div>
      </footer>

    </div>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
